 {axis:'CONFORTO × POTENCIAL',theme:'void',q:'Você está vivendo no nível do seu <em>potencial</em> — ou apenas no nível do seu conforto?',truth:'Não responda com a imagem que você gostaria de projetar. Procure o ponto exato em que você já sabe que está se poupando.',principle:'Autoconsciência antes de performance. Confronto útil identifica comportamento; não ataca dignidade.'},
