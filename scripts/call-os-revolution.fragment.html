 const company=$('#callCompany')?.value.trim()||'sua empresa';
 const person=$('#callPerson')?.value.trim()||'decisor';
 const sector=$('#callSector')?.value||'Negócios locais';
 const tone=$('#callTone')?.value||'Natural';
 const intent=$('#callIntent')?.value||'Gerar curiosidade';
 return{company,person,sector,tone,intent,pattern:sectorPattern[sector]||sectorPattern['Negócios locais']};
};
const bestFromHistory=()=>{
 const h=getHistory();if(!h.length)return null;
 const success=h.filter(x=>x.outcome==='Reunião');
 const countBy=(arr,key)=>arr.reduce((a,x)=>(a[x[key]||'—']=(a[x[key]||'—']||0)+1,a),{});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0];
 return success.length?{tone:top(countBy(success,'tone')),intent:top(countBy(success,'intent')),meetings:success.length,total:h.length}:null;
};

 const c=getContext(),hist=bestFromHistory();
 let tone=c.tone,intent=c.intent,opening=c.pattern.opening;
 if(hist?.tone)tone=hist.tone;if(hist?.intent)intent=hist.intent;
 return{...c,tone,intent,opening,confidence:hist?Math.min(94,68+hist.meetings*4):72,reason:hist?`A recomendação incorpora ${hist.meetings} reunião(ões) registradas no seu histórico local.`:`Sem histórico suficiente ainda. A recomendação usa o padrão operacional de ${c.sector}.`};

};

const renderImpact=()=>{
 const root=$('#callRevImpact');if(!root)return;
 const active=$$('.call-script-block')[0];

 root.innerHTML=parts.slice(0,5).map((p,i)=>{const s=impactScores(i);return`<div class="call-impact-row"><div class="call-impact-phrase">${safe(p)}</div>${[['DEFESA ↓',s.def],['CURIOSIDADE',s.cur],['SIMULAÇÃO',s.sim],['AÇÃO',s.act]].map(([n,v])=>`<div><div class="call-impact-name">${n}</div><div class="call-impact-meter"><span style="width:${v}%"></span></div></div>`).join('')}</div>`}).join('');

const enhance=()=>{
 const page=$('.call-page');if(!page||$('#callRevAutopilotSection'))return false;
 const hero=$('.call-hero');if(hero){hero.querySelector('.call-eyebrow').textContent='BABEL CALL INTELLIGENCE · CONVERSATIONAL ENGINEERING';hero.querySelector('.call-h1').innerHTML='Antes, vendedores aprendiam<br>o que dizer.<br><em>Agora, a ligação aprende o que funciona.</em>';hero.querySelector('.call-lead').textContent='A copy continua no centro. Mas agora existe uma camada acima dela: contexto antes da chamada, engenharia psicológica da frase, execução guiada, silêncio, treino e aprendizado por resultado.'}
 const first=$$('.call-section',page)[0];
 const auto=section('00 · CALL AUTOPILOT','Antes de ligar, a Babel decide como entrar.','O sistema combina setor, decisor provável, dor operacional, seu histórico local e o objetivo da chamada para recomendar uma estratégia.');auto.id='callRevAutopilotSection';auto.innerHTML+=`<div class="call-rev-hero"><div class="call-rev-kicker">PRE-CALL INTELLIGENCE · 30 SEGUNDOS</div><h3>Não disque até saber qual pensamento você quer provocar.</h3><p>O vendedor comum prepara uma apresentação. O Call Intelligence prepara uma reação: curiosidade, reflexão e uma próxima ação concreta.</p></div><div class="call-autopilot" id="callRevAutopilot"></div><div class="call-preflight" id="callRevPreflight"></div>`;first?.parentNode?.insertBefore(auto,first);
 const scripts=$$('.call-section',page)[0]||first;
 const impact=section('01B · IMPACT MAP','Veja o que cada parte da copy faz na mente.','A copy deixa de ser texto corrido e vira engenharia: baixar defesa, abrir curiosidade, ativar simulação mental e conduzir para uma ação.');impact.innerHTML+=`<div class="call-rev-note"><b>Regra:</b> tensão não significa manipulação teatral. A frase precisa continuar verdadeira, natural e sustentável quando o prospect fizer uma pergunta fora do roteiro.</div><div class="call-impact-map" id="callRevImpact" style="margin-top:14px"></div>`;insertAfter(scripts,impact);
 const live=$('#callLiveSection')||$$('.call-section',page).find(s=>/LIVE/i.test(s.textContent||''));if(live){const graph=section('LIVE · CONVERSATION GRAPH','A ligação agora tem estado, não apenas texto.','Cada etapa representa um objetivo conversacional. Use o grafo para saber se você ainda está conquistando atenção, diagnosticando, posicionando ou fechando.');graph.innerHTML+=`<div class="call-graph" id="callRevGraph"></div><div class="call-live-coach"><div class="call-live-coach-head"><div class="call-live-coach-title">PRÓXIMA DECISÃO</div><div class="call-live-coach-mode">GPS DA CONVERSA</div></div><div class="call-live-coach-text" id="callLiveCoachText"></div><div class="call-controls" style="margin-top:10px"><button class="call-rev-action" id="callGraphBack">← etapa</button><button class="call-rev-action primary" id="callGraphNext">próxima etapa →</button><button class="call-rev-action" id="callTriggerSilence">SILÊNCIO</button></div></div><div class="call-silence" id="callSilenceEngine"><span>SILENCE ENGINE</span><strong>AGORA, CALE-SE.</strong><div class="call-silence-time" id="callSilenceTime">00:00</div><span>deixe o prospect construir a resposta</span><div style="margin-top:10px"><button class="call-rev-action" id="callStopSilence">ele respondeu</button></div></div>`;insertAfter(live,graph)}
 const lab=section('07 · CALL LAB','Treine a resposta antes de enfrentar a objeção.','O laboratório não tenta substituir treinamento humano: ele força concisão, pergunta de retorno e controle emocional em cenários comuns de cold call.');lab.innerHTML+=`<div class="call-lab"><div class="call-lab-scenario"><div class="call-rev-label">PROSPECT SIMULADO</div><div class="call-lab-prospect" id="callLabProspect"></div><div class="call-rev-sub" id="callLabGoal"></div><div style="margin-top:12px"><button class="call-rev-action" id="callLabNext">trocar cenário</button></div></div><div><textarea class="call-lab-input" id="callLabAnswer" placeholder="Responda exatamente como falaria..."></textarea><div class="call-controls" style="margin-top:8px"><button class="call-rev-action primary" id="callLabAnalyze">ANALISAR RESPOSTA</button></div><div class="call-lab-score" style="margin-top:10px"><div class="call-lab-metric"><b data-lab-metric>—</b><span>naturalidade</span></div><div class="call-lab-metric"><b data-lab-metric>—</b><span>concisão</span></div><div class="call-lab-metric"><b data-lab-metric>—</b><span>curiosidade</span></div><div class="call-lab-metric"><b data-lab-metric>—</b><span>controle</span></div></div><div class="call-lab-feedback" id="callLabFeedback"></div></div></div>`;
 const memory=$$('.call-section',page).find(s=>/CALL MEMORY/i.test(s.textContent||''));if(memory)insertAfter(memory,lab);else page.appendChild(lab);
 const learn=section('08 · CALL DEBRIEF','Toda ligação precisa melhorar a próxima.','O histórico local começa a transformar tentativa em conhecimento: taxa de reunião, tom que mais converte e intenção que mais aparece nas chamadas bem-sucedidas.');learn.innerHTML+=`<div id="callRevLearning"></div>`;insertAfter(lab,learn);
 renderAutopilot();renderImpact();renderGraph();setGraph(0);renderLab();renderLearning();
 ['callCompany','callPerson','callSector','callTone','callIntent','callIntensity'].forEach(id=>$('#'+id)?.addEventListener('change',()=>setTimeout(()=>{renderAutopilot();renderImpact()},40)));
 $('#callGenerate')?.addEventListener('click',()=>setTimeout(()=>{renderAutopilot();renderImpact()},50));
 $('#callGraphNext')?.addEventListener('click',()=>{setGraph(state.graphStage+1);if(state.graphStage===3)startSilence()});$('#callGraphBack')?.addEventListener('click',()=>setGraph(state.graphStage-1));$('#callTriggerSilence')?.addEventListener('click',startSilence);$('#callStopSilence')?.addEventListener('click',()=>{stopSilence();setGraph(Math.max(4,state.graphStage))});
 $('#callLabNext')?.addEventListener('click',()=>{state.labIndex=(state.labIndex+1)%labScenarios.length;renderLab()});$('#callLabAnalyze')?.addEventListener('click',analyzeLab);
 $$('[data-outcome]').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>{renderLearning();renderAutopilot()},80)));
 return true;
};
const boot=()=>{if(enhance())return;let n=0;const t=setInterval(()=>{n++;if(enhance()||n>40)clearInterval(t)},100)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0),{once:true});else setTimeout(boot,0);
})();
</script>
