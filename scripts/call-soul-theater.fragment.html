 line.textContent=turn?.text||'Pronto para começar.';speaker.textContent=turn?.speaker||'BABEL';speaker.classList.toggle('prospect',turn?.speaker==='PROSPECT');avatar.textContent=turn?.speaker==='PROSPECT'?'P':'RK';avatar.classList.toggle('prospect',turn?.speaker==='PROSPECT');stage.classList.toggle('playing',theater.playing);renderTheaterMind(turn);renderTranscript();
 soulQQ('.call-theater-tab').forEach((b,i)=>b.classList.toggle('active',i===theater.script));

 });
 theater.dialogue=buildDialogue(theater.script);theater.turn=Math.min(theater.turn,Math.max(0,theater.dialogue.length-1));renderTheater();

const boot=()=>{
 if(document.documentElement.dataset.callTheaterMounted==='1')return true;
 try{
  const ready=soulQ('#callRevAutopilotSection')&&soulQ('#callScripts');
  if(!ready)return false;
