<script id="babelCallThesisModule">
(()=>{
document.documentElement.dataset.callThesisScriptExecuted='1';
const thesisQ=(s,r=document)=>r.querySelector(s),thesisQQ=(s,r=document)=>[...r.querySelectorAll(s)];
const thesisEsc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const thesisCtx=()=>{const company=thesisQ('#callCompany')?.value.trim()||'a empresa';const person=thesisQ('#callPerson')?.value.trim()||'';const h=new Date().getHours();return{company,person,greeting:h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}};
const canonicalBlocks=ctx=>[
 {name:'01 · ENTRADA GENUÍNA',role:'baixar defesa sem parecer pitch',text:`${ctx.greeting}, eu falo com um dos executivos da ${ctx.company}?`,function:'Confirmar a pessoa certa antes de tentar vender qualquer ideia.',mind:'A mente avalia apenas quem está ligando e se precisa se defender.',risk:'Explicar Babel cedo demais transforma curiosidade em filtro comercial.',pause:'Curta. Espere a resposta antes de continuar.'},
 {name:'02 · CURIOSIDADE',role:'comprar alguns segundos de atenção',text:ctx.person?`Olá, ${ctx.person}. Me chamo Ryan Kirk, sou um dos representantes da empresa Babel. Eu só queria te fazer um simples questionamento.`:`Olá. Me chamo Ryan Kirk, sou um dos representantes da empresa Babel. Eu só queria te fazer um simples questionamento.`,function:'Apresentar-se sem abrir uma apresentação e criar uma lacuna de curiosidade.',mind:'“Qual é esse questionamento?” é mais leve que “o que ele quer me vender?”.',risk:'Prometer ser rápido e depois falar demais quebra confiança imediatamente.',pause:'Depois de “questionamento”, espere “pode falar”.'},
 {name:'03 · PROJEÇÃO MENTAL',role:'fazer o decisor construir o próprio futuro',text:ctx.person?`Certo, ${ctx.person}. Se o senhor visse sua empresa trabalhando de forma automática e pensando por conta própria, qual seria a primeira coisa que ela iria resolver na sua empresa?`:`Certo. Se o senhor visse sua empresa trabalhando de forma automática e pensando por conta própria, qual seria a primeira coisa que ela iria resolver na sua empresa?`,function:'Fazer o cliente produzir sozinho a primeira aplicação de valor.',mind:'Ele precisa procurar dentro da operação uma dor concreta para completar a cena.',risk:'Dar exemplos antes da resposta contamina o diagnóstico e mata a reflexão.',pause:'Aqui o silêncio é parte da copy. Espere a pessoa pensar.'},
 {name:'04 · SIGNIFICADO BABEL',role:'ligar a resposta às duas dores centrais',text:ctx.person?`Perfeito, senhor ${ctx.person}. Hoje a Babel é responsável por dar uma consciência para a sua empresa, e o grande propósito dela é não deixar faltar tempo nem dinheiro para o senhor.`:`Perfeito. Hoje a Babel é responsável por dar uma consciência para a sua empresa, e o grande propósito dela é não deixar faltar tempo nem dinheiro para o senhor.`,function:'Transformar a reflexão anterior em significado econômico e operacional.',mind:'A Babel deixa de ser software abstrato e passa a representar tempo recuperado e dinheiro protegido.',risk:'Listar funcionalidades aqui rebaixa a conversa e aumenta objeções técnicas.',pause:'Uma frase. Depois observe se ele pede “como?”.'},
 {name:'05 · PRÓXIMO PASSO',role:'fechar apenas os próximos 15 minutos',text:`Gostaria de saber se o senhor consegue participar de uma reunião de no máximo 15 minutos referente à Babel entre hoje e amanhã?`,function:'Converter curiosidade em uma próxima conversa pequena e definida.',mind:'15 minutos reduz custo percebido; hoje ou amanhã reduz esforço de agenda.',risk:'Tratar hoje/amanhã como obrigação gera resistência. É uma facilitação, não coerção.',pause:'Fez a pergunta? Pare. Deixe ele escolher, recusar ou propor outro horário.'}
];
const variantBank=[
 [
  c=>`${c.greeting}. Eu consigo falar com um dos executivos da ${c.company}?`,
  c=>`${c.greeting}, por gentileza: eu falo com alguém da direção da ${c.company}?`,
  c=>`${c.greeting}. Eu precisava falar rapidamente com um dos responsáveis pela ${c.company}. É com o senhor?`,
  c=>`${c.greeting}, eu falo com quem responde pelas decisões da ${c.company}?`
 ],
 [
  c=>c.person?`Olá, ${c.person}. Ryan Kirk, da Babel. Eu não quero tomar seu tempo; eu só queria te deixar um questionamento bem simples.`:`Olá. Ryan Kirk, da Babel. Eu não quero tomar seu tempo; eu só queria te deixar um questionamento bem simples.`,
  c=>c.person?`Olá, ${c.person}. Aqui é Ryan Kirk, um dos representantes da Babel. Eu preciso só validar um questionamento com o senhor.`:`Olá. Aqui é Ryan Kirk, um dos representantes da Babel. Eu preciso só validar um questionamento com o senhor.`,
  c=>c.person?`Olá, ${c.person}. Me chamo Ryan Kirk, da Babel. Eu só queria colocar um questionamento rápido na mesa e ouvir sua reação.`:`Olá. Me chamo Ryan Kirk, da Babel. Eu só queria colocar um questionamento rápido na mesa e ouvir sua reação.`,
  c=>c.person?`Olá, ${c.person}. Ryan Kirk, Babel. Eu vou direto ao ponto: tenho um único questionamento para o senhor.`:`Olá. Ryan Kirk, Babel. Eu vou direto ao ponto: tenho um único questionamento para o senhor.`
 ],
 [
  c=>`Se amanhã a ${c.company} começasse o dia sabendo sozinha o que precisa resolver, qual seria a primeira decisão que o senhor colocaria nas mãos dela?`,
  c=>`Se a ${c.company} pudesse perceber um problema antes de alguém avisar e agir sozinha, qual problema o senhor gostaria que ela enxergasse primeiro?`,
  c=>`Se por 30 dias o senhor não precisasse lembrar ninguém da próxima ação, qual parte da ${c.company} teria que aprender a agir sozinha primeiro?`,
  c=>`Se a ${c.company} ganhasse a capacidade de perceber, decidir e agir sem esperar comando, onde isso devolveria mais tempo ou dinheiro para o senhor?`
 ],
 [
  c=>`É justamente aí que a Babel entra: damos consciência operacional à ${c.company} para ela perceber o que precisa acontecer e agir. O propósito é simples: devolver tempo ao senhor e impedir que dinheiro se perca por falta de próxima ação.`,
  c=>`Perfeito. A Babel existe para transformar esse ponto em uma parte da ${c.company} que trabalha sem depender da sua atenção o tempo todo. Menos tempo preso em comando; menos dinheiro vazando no caminho.`,
  c=>`É exatamente essa resposta que a Babel transforma em operação. A ${c.company} começa a perceber contexto e executar o próximo passo. No fim, protegemos os dois recursos que mais doem quando faltam: tempo e dinheiro.`,
  c=>`Perfeito. O que a Babel faz é dar à operação da ${c.company} capacidade de perceber e reagir sem depender de alguém lembrar. Para o senhor, isso se traduz em duas coisas: tempo recuperado e dinheiro protegido.`
 ],
 [
  c=>`Eu queria te mostrar isso aplicado à ${c.company} em no máximo 15 minutos. O senhor tem uma janela melhor hoje ou amanhã?`,
  c=>`Se eu te mostrar em 15 minutos exatamente onde isso começaria na ${c.company}, é mais fácil hoje ou amanhã?`,
  c=>`Eu só preciso de 15 minutos para colocar esse cenário na operação da ${c.company}. Se fizer sentido, seguimos; se não, paramos ali. O senhor prefere hoje ou amanhã?`,
  c=>`Vale eu te mostrar esse desenho aplicado à ${c.company} em 15 minutos, sem apresentação longa? Se sim, hoje ou amanhã funciona melhor?`
 ]
];

const arenaScenarios=[
{p:'“Sim, sou eu. Quem gostaria?”',mission:'Você encontrou o decisor. Compre atenção sem abrir um pitch.',options:[['Olá, senhor. Somos uma empresa de automação e temos uma solução muito interessante para apresentar.',0],['Olá. Me chamo Ryan Kirk, sou um dos representantes da Babel. Eu só queria te fazer um simples questionamento.',2],['Ótimo, então eu queria te explicar rapidamente tudo o que a Babel consegue fazer.',0]],feedback:'A melhor resposta preserva a curiosidade e cumpre a promessa de ser simples.'},
{p:'“Certo, pode falar.”',mission:'Agora existe permissão. Faça a mente do decisor trabalhar antes de explicar Babel.',options:[['A Babel automatiza CRM, follow-up e vários processos internos.',0],['Se o senhor visse sua empresa trabalhando de forma automática e pensando por conta própria, qual seria a primeira coisa que ela iria resolver?',2],['O senhor tem algum processo manual hoje?',1]],feedback:'Projeção mental cria uma resposta mais rica que uma pergunta técnica genérica.'},
{p:'“Eu começaria pelo atendimento. A equipe perde muito tempo ali.”',mission:'A dor apareceu. Não mude de assunto e não despeje funcionalidades.',options:[['Perfeito. É justamente esse tipo de resposta que importa. A Babel dá consciência operacional para a empresa agir sem depender de cada comando; no fim, isso protege tempo e dinheiro.',2],['Temos automações, integrações, CRM e inteligência artificial.',0],['Legal. E qual CRM vocês usam?',1]],feedback:'A ponte precisa nascer da palavra que o prospect acabou de entregar.'},
{p:'“Manda alguma coisa no WhatsApp.”',mission:'Evite material genérico e ganhe uma informação que melhore o próximo contato.',options:[['Claro, mando nossa apresentação completa agora.',0],['Mando sim. Só para eu não te mandar algo genérico: hoje o maior gargalo está em atendimento, follow-up ou operação?',2],['Nosso material é bem rápido, dá uma olhada quando puder.',0]],feedback:'Uma objeção curta pode virar diagnóstico sem confronto.'},
{p:'“A gente já tem automação.”',mission:'Não ataque o sistema atual. Descubra o limite dele.',options:[['Mas a nossa é melhor e usa IA.',0],['Perfeito. Ela só executa regras configuradas ou também percebe quando uma próxima ação precisa acontecer sem alguém mandar?',2],['Qual empresa fornece?',1]],feedback:'Suba a conversa de ferramenta para capacidade operacional.'},
{p:'“Quanto custa?”',mission:'Não fuja do preço, mas não deixe a conversa virar comparação sem contexto.',options:[['Dois mil reais por mês.',1],['A estrutura costuma girar em torno de R$2 mil, mas a conta só faz sentido se ela recuperar mais valor do que isso. Antes de preço, eu queria entender quantas oportunidades esse ponto está deixando escapar.',2],['Depende. Só consigo falar na reunião.',0]],feedback:'Preço com equação econômica preserva confiança sem vender no escuro.'},
{p:'“Agora eu realmente não consigo falar.”',mission:'Respeite o tempo. O objetivo passa a ser um retorno específico.',options:[['É só um minuto, prometo.',0],['Sem problema. Qual horário eu consigo te ligar por dois minutos sem atrapalhar?',2],['Então eu mando uma mensagem.',1]],feedback:'Respeitar o “agora não” aumenta a chance de existir um “depois sim”.'},
{p:'“Entendi. Como isso funcionaria na prática?”',mission:'Interesse existe. Não transforme a ligação em demo improvisada.',options:[['Então, primeiro temos CRM, automações, agentes e integrações...',0],['Eu consigo te mostrar exatamente isso aplicado à sua empresa em no máximo 15 minutos. O senhor tem uma janela melhor hoje ou amanhã?',2],['É bastante coisa, depende do projeto.',1]],feedback:'Quando o prospect pede mecanismo, a próxima venda é a reunião — não a plataforma inteira.'}
];
const loadArena=()=>{let s;try{s=JSON.parse(localStorage.getItem('babel-call-arena')||'null')}catch{}return s&&typeof s.xp==='number'?s:{xp:0,streak:0,best:0,rounds:0,correct:0,index:0}};
const saveArena=()=>localStorage.setItem('babel-call-arena',JSON.stringify(thesisState.arena));
const arenaLevel=xp=>xp<500?['OBSERVADOR',0,500]:xp<1200?['CONDUTOR',500,1200]:xp<2500?['ARQUITETO',1200,2500]:['ELITE',2500,5000];
const arenaSound=good=>{try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=good?640:180;g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.start();o.stop(a.currentTime+.17)}catch{}};
const arenaBurst=()=>{for(let i=0;i<18;i++){const e=document.createElement('i');e.className='arena-particle';e.style.left=(50+Math.random()*8-4)+'vw';e.style.top=(55+Math.random()*8-4)+'vh';e.style.setProperty('--dx',(Math.random()*180-90)+'px');e.style.setProperty('--dy',(Math.random()*-170-25)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),900)}};
const updateArenaSide=()=>{const a=thesisState.arena,l=arenaLevel(a.xp),need=l[2]-l[1],within=Math.min(100,((a.xp-l[1])/need)*100);const name=thesisQ('#arenaLevelName'),xp=thesisQ('#arenaXP'),bar=thesisQ('#arenaXPBar');if(name)name.textContent=l[0];if(xp)xp.textContent=a.xp+' XP';if(bar)bar.style.width=within+'%';[['Streak',a.streak],['Best',a.best],['Wins',a.correct]].forEach(([id,v])=>{const el=thesisQ('#arena'+id);if(el)el.textContent=v})};
const startArenaTimer=()=>{clearInterval(thesisState.arenaTimer);thesisState.arenaSeconds=15;const timer=thesisQ('#arenaTimer'),bar=thesisQ('#arenaProgress');if(timer)timer.textContent='15';if(bar)bar.style.width='100%';thesisState.arenaTimer=setInterval(()=>{thesisState.arenaSeconds--;if(timer)timer.textContent=String(Math.max(0,thesisState.arenaSeconds)).padStart(2,'0');if(bar)bar.style.width=Math.max(0,thesisState.arenaSeconds/15*100)+'%';if(thesisState.arenaSeconds<=0){clearInterval(thesisState.arenaTimer);if(!thesisState.arenaLocked)answerArena(null)}},1000)};
const renderArena=()=>{const a=thesisState.arena,s=arenaScenarios[a.index%arenaScenarios.length];thesisState.arenaLocked=false;const p=thesisQ('#arenaProspect'),m=thesisQ('#arenaMission'),opts=thesisQ('#arenaOptions'),feed=thesisQ('#arenaFeedback'),stage=thesisQ('#arenaStage');if(p)p.textContent=s.p;if(m)m.textContent=s.mission;if(opts)opts.innerHTML=s.options.map((o,i)=>`<button class="arena-option" data-arena-option="${i}">${thesisEsc(o[0])}</button>`).join('');if(feed){feed.classList.remove('show');feed.innerHTML=''}if(stage)stage.classList.toggle('combo',a.streak>=3);thesisQQ('[data-arena-option]').forEach(b=>b.onclick=()=>answerArena(Number(b.dataset.arenaOption)));updateArenaSide();startArenaTimer()};
const answerArena=i=>{if(thesisState.arenaLocked)return;thesisState.arenaLocked=true;clearInterval(thesisState.arenaTimer);const a=thesisState.arena,s=arenaScenarios[a.index%arenaScenarios.length],quality=i===null?0:s.options[i][1],elapsed=15-thesisState.arenaSeconds;let gain=0;if(quality===2){a.streak++;a.correct++;gain=100+Math.min(100,a.streak*10)+Math.max(0,30-elapsed*2);a.best=Math.max(a.best,a.streak);arenaSound(true);arenaBurst()}else{a.streak=0;gain=quality===1?35:0;arenaSound(false)}a.xp+=gain;a.rounds++;saveArena();thesisQQ('[data-arena-option]').forEach((b,idx)=>{const q=s.options[idx][1];if(q===2)b.classList.add('best');else if(idx===i||i===null)b.classList.add('wrong');b.disabled=true});const f=thesisQ('#arenaFeedback');if(f){f.classList.add('show');f.innerHTML=`<b>${quality===2?'+ '+gain+' XP · RESPOSTA DE ELITE':quality===1?'+ 35 XP · FUNCIONA, MAS PODE SUBIR':'RODADA PERDIDA'}</b><br>${thesisEsc(s.feedback)}`};updateArenaSide()};
const mountArena=()=>{const radar=thesisQ('#callRadarSection');if(!radar||thesisQ('#callArenaSection'))return !!thesisQ('#callArenaSection');const sec=document.createElement('section');sec.className='call-section';sec.id='callArenaSection';sec.innerHTML=`<div class="call-section-head"><div><div class="call-section-num">03 · CALL ARENA</div><h2>Treine decisões, não decoração.</h2></div><p class="call-section-desc">Rodadas rápidas, XP, streak e níveis. O jogo recompensa a mesma tese da Copy Principal: curiosidade antes de explicação, projeção antes de pitch, escuta antes de resposta e próximo passo antes de excesso.</p></div><div class="call-arena"><div class="arena-stage" id="arenaStage"><div class="arena-content"><div class="arena-head"><div class="arena-mode">BABEL · CONVERSATION GAME</div><div class="arena-timer" id="arenaTimer">15</div></div><div class="arena-progress"><span id="arenaProgress" style="width:100%"></span></div><div class="arena-prospect-label">PROSPECT DISSE</div><div class="arena-prospect" id="arenaProspect"></div><div class="arena-mission" id="arenaMission"></div><div class="arena-options" id="arenaOptions"></div><div class="arena-feedback" id="arenaFeedback"></div></div></div><aside class="arena-side"><div class="arena-level"><div><div class="thesis-copy-kicker">NÍVEL</div><div class="arena-level-name" id="arenaLevelName">OBSERVADOR</div></div><div class="arena-xp" id="arenaXP">0 XP</div></div><div class="arena-xpbar"><span id="arenaXPBar" style="width:0%"></span></div><div class="arena-stats"><div class="arena-stat"><b id="arenaStreak">0</b><span>streak</span></div><div class="arena-stat"><b id="arenaBest">0</b><span>melhor combo</span></div><div class="arena-stat"><b id="arenaWins">0</b><span>acertos</span></div></div><div class="arena-doctrine"><h4>O jogo está treinando quatro reflexos.</h4><div class="arena-doctrine-item"><b>1. NÃO SE DEFENDA.</b> Objeção não é ataque.</div><div class="arena-doctrine-item"><b>2. NÃO EXPLIQUE CEDO.</b> Pergunta forte vem antes do produto.</div><div class="arena-doctrine-item"><b>3. USE A RESPOSTA.</b> A próxima frase nasce do que o outro acabou de dizer.</div><div class="arena-doctrine-item"><b>4. FECHE PEQUENO.</b> A missão da cold call é conquistar a próxima conversa.</div></div><button class="arena-next" id="arenaNext">PRÓXIMA RODADA →</button></aside></div>`;radar.insertAdjacentElement('afterend',sec);thesisState.arena=loadArena();thesisQ('#arenaNext').onclick=()=>{const a=thesisState.arena;a.index=(a.index+1)%arenaScenarios.length;saveArena();renderArena()};renderArena();return true};
const bindContext=()=>{if(document.documentElement.dataset.callThesisBound)return;document.documentElement.dataset.callThesisBound='1';['callCompany','callPerson','callSector','callTone','callIntent','callIntensity'].forEach(id=>{const el=thesisQ('#'+id);if(!el)return;['change','input'].forEach(ev=>el.addEventListener(ev,()=>{renderCopy();syncIgnition()}))});thesisQ('#callGenerate')?.addEventListener('click',()=>setTimeout(()=>{renderCopy();syncIgnition()},30))};
const bootThesis=()=>{try{if(document.documentElement.dataset.callThesisMounted==='1')return true;if(document.documentElement.dataset.callTheaterMounted!=='1')return false;if(!thesisQ('#callRevAutopilotSection')||!thesisQ('#callScripts'))return false;mountIgnition();mountCopy();mountRadar();mountArena();bindContext();if(!thesisQ('#thesisCopySection')||!thesisQ('#callRadarSection')||!thesisQ('#callArenaSection')||!thesisQ('#callTheaterStage'))return false;document.documentElement.dataset.callThesisMounted='1';delete document.documentElement.dataset.callThesisError;return true}catch(err){document.documentElement.dataset.callThesisError=String(err?.message||err).slice(0,180);console.error('BABEL CALL THESIS RUNTIME ERROR',err);return false}};
const thesisObserver=new MutationObserver(()=>{if(bootThesis())thesisObserver.disconnect()});thesisObserver.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['data-call-theater-mounted']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootThesis,{once:true});else queueMicrotask(bootThesis);window.addEventListener('load',bootThesis,{once:true});
})();
</script>
