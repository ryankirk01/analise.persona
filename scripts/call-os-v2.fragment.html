<script id="babelCallOSModule">
(()=>{
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const sectors={
'Negócios locais':{question:'Hoje, qual parte da operação ainda depende de alguém lembrar de fazer a próxima coisa?',effect:'tirar tarefas repetitivas da cabeça da equipe e colocar a operação para avançar sozinha'},
'Odontologia':{question:'Hoje, quem garante que um paciente que pediu informação não se perca entre o WhatsApp e a agenda?',effect:'acompanhar pacientes, confirmações e retornos sem depender de cobrança manual'},
'Clínicas e saúde':{question:'Quanto da agenda ainda depende de alguém lembrar de confirmar, cobrar resposta ou reativar paciente?',effect:'fazer atendimento, confirmação e reativação acontecerem no momento certo'},
'Estética e beleza':{question:'Quando alguém pergunta valor e some, existe alguma coisa que traz essa pessoa de volta automaticamente?',effect:'transformar conversa em agenda e manter o retorno acontecendo sem esforço manual'},
'Restaurantes e gastronomia':{question:'No horário de pico, quanto atendimento ainda depende de alguém conseguir responder tudo a tempo?',effect:'fazer reservas, atendimento e retorno de clientes fluírem com menos dependência da equipe'},
'Hotelaria e pousadas':{question:'Quando alguém pergunta disponibilidade e não reserva, essa conversa volta sozinha ou depende de alguém lembrar?',effect:'acompanhar consultas e recuperar reservas sem deixar oportunidade esfriar'},
'Imobiliárias e corretores':{question:'Depois da primeira tentativa, um lead bom continua sendo acompanhado ou acaba dependendo da memória do corretor?',effect:'qualificar e acompanhar leads até a visita sem deixar oportunidade parada'},
'Advocacia':{question:'Quanto tempo da equipe ainda é gasto só entendendo se um novo contato realmente faz sentido?',effect:'fazer triagem e organização inicial antes de consumir tempo jurídico'},
'Contabilidade':{question:'Qual parte da entrada ou do atendimento de clientes ainda precisa ser repetida manualmente todos os dias?',effect:'automatizar entrada, acompanhamento e demandas repetitivas sem perder controle'},
'Automotivo':{question:'Depois que um orçamento é enviado, quem garante que exista uma segunda tentativa no momento certo?',effect:'recuperar orçamentos, revisões e retornos sem depender de lembretes humanos'},
'Academias e fitness':{question:'Quando alguém pede um plano e não aparece, essa pessoa continua sendo acompanhada ou a conversa morre ali?',effect:'acompanhar interessados e reativar alunos sem depender de insistência manual'},
'Educação e cursos':{question:'Quando um interessado não decide no primeiro contato, quem garante que a conversa continue até uma resposta?',effect:'acompanhar interesse, matrícula e rematrícula de forma automática'},
'Varejo':{question:'Vocês conseguem saber quem demonstrou intenção de compra e não voltou, sem alguém procurar isso manualmente?',effect:'reativar intenção e recompra de clientes sem depender de campanhas soltas'},
'Construção e arquitetura':{question:'Depois que uma proposta importante é enviada, o acompanhamento acontece por sistema ou pela memória de alguém?',effect:'manter propostas e oportunidades avançando sem depender de cobrança manual'},
'Turismo e experiências':{question:'Quem consulta preço e não reserva recebe uma nova abordagem automaticamente no momento certo?',effect:'recuperar consultas e reservas sem aumentar a dependência da equipe'},
'Pet shops e veterinária':{question:'Quando chega a hora de retorno, vacina ou novo serviço, o sistema age sozinho ou alguém precisa lembrar?',effect:'criar recorrência de atendimento sem depender de lembrete humano'}
};
const toneNames=['Executivo','Natural','Direto','Curioso','Provocador','Minimalista'];
const intentNames=['Gerar curiosidade','Conseguir reunião','Descobrir manualidade','Criar visão de futuro','Falar com decisor'];
const state={company:'a empresa',sector:'Negócios locais',tone:'Natural',intent:'Gerar curiosidade',intensity:2,scripts:[],active:0,timer:0,timerId:null};
const toast=msg=>{const e=q('#callToast');if(!e)return;e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1500)};
const copy=async text=>{try{await navigator.clipboard.writeText(text);toast('Script copiado')}catch{toast('Selecione e copie manualmente')}};
const detectSector=txt=>{const t=String(txt).toLowerCase();const p=[['odont','Odontologia'],['dent','Odontologia'],['clínic','Clínicas e saúde'],['clinic','Clínicas e saúde'],['médic','Clínicas e saúde'],['estét','Estética e beleza'],['beleza','Estética e beleza'],['restaur','Restaurantes e gastronomia'],['pizz','Restaurantes e gastronomia'],['hotel','Hotelaria e pousadas'],['pousad','Hotelaria e pousadas'],['imobili','Imobiliárias e corretores'],['corret','Imobiliárias e corretores'],['advoc','Advocacia'],['contab','Contabilidade'],['oficina','Automotivo'],['automot','Automotivo'],['academ','Academias e fitness'],['fitness','Academias e fitness'],['escola','Educação e cursos'],['curso','Educação e cursos'],['loja','Varejo'],['varejo','Varejo'],['constru','Construção e arquitetura'],['arquitet','Construção e arquitetura'],['turis','Turismo e experiências'],['pet','Pet shops e veterinária'],['veter','Pet shops e veterinária']];for(const [a,b] of p)if(t.includes(a))return b;return 'Negócios locais'};
const discover=()=>{const nodes=qa('article,.card,.sector-card,h3,h4').map(e=>(e.innerText||'').trim()).filter(t=>t.length>4&&t.length<450);const out=[];for(const raw of nodes){const name=raw.split('\n').map(x=>x.trim()).filter(Boolean)[0];if(name&&name.length<75&&!/babel|inteligência|mercado|setor|oportunidade|fonte/i.test(name))out.push({name,sector:detectSector(raw)})}return out.filter((x,i,a)=>a.findIndex(y=>y.name===x.name)===i).slice(0,30)};
const naturalCompany=c=>c==='a empresa'||!c?'a empresa':c;
const introFor=(tone,c)=>({
Executivo:`Boa tarde, tudo bem? Eu consigo falar com quem responde pela operação da ${c}? Meu nome é Ryan Kirk, sou da Babel. Vou ser bem objetivo porque eu sei que ligação inesperada toma tempo.`,
Natural:`Boa tarde, tudo bem? Eu queria falar rapidinho com quem cuida da operação da ${c}. Meu nome é Ryan Kirk, sou da Babel. Prometo ser breve.`,
Direto:`Boa tarde. Quem responde pela operação da ${c}? Aqui é o Ryan Kirk, da Babel. Vou direto ao ponto e te faço só uma pergunta.`,
Curioso:`Boa tarde, tudo bem? Eu consigo falar com alguém que conheça bem a operação da ${c}? Aqui é o Ryan Kirk, da Babel. Eu fiquei com uma pergunta meio diferente sobre vocês.`,
Provocador:`Boa tarde. Eu queria falar com quem decide como a ${c} vai operar daqui para frente. Meu nome é Ryan Kirk, da Babel. Tenho uma pergunta que foge um pouco da abordagem comercial comum.`,
Minimalista:`Boa tarde. Falo com quem cuida da operação da ${c}? Ryan Kirk, da Babel. Uma pergunta rápida.`
})[tone]||'';
const questionFor=(intent,c,S)=>({
'Gerar curiosidade':`Se você visse a ${c} funcionando sem a equipe precisar mandar cada próxima tarefa, o que mais te chamaria atenção?`,
'Conseguir reunião':`Se eu conseguisse te mostrar onde a ${c} ainda depende de ação manual e como reduzir isso, valeria uma conversa de 15 minutos?`,
'Descobrir manualidade':S.question,
'Criar visão de futuro':`Imagina a ${c} continuando a atender, acompanhar e executar tarefas mesmo quando ninguém está lembrando o sistema do que fazer. O que isso mudaria aí dentro?`,
'Falar com decisor':`Quem aí dentro olha para automação, atendimento e eficiência operacional? Eu queria validar uma ideia em menos de um minuto.`
})[intent]||S.question;
const bridgeFor=(level,S)=>level===1?`É justamente nisso que a Babel trabalha: ${S.effect}.`:level===3?`É exatamente essa virada que a Babel está construindo: uma empresa que deixa de esperar comando para cada passo e começa a agir sozinha onde hoje existe rotina repetitiva.`:`É exatamente isso que a Babel faz: pega partes manuais ou semiautomáticas da operação e transforma em fluxos que acompanham, decidem e executam a próxima ação.`;
const closeFor=(intent,c)=>intent==='Conseguir reunião'?`Se fizer sentido, eu te mostro isso aplicado à ${c} em 15 minutos e você decide se existe valor ou não. Qual horário fica melhor?`:`Se eu te mostrar em 15 minutos onde isso poderia começar na ${c}, você topa olhar comigo?`;
const makeVariants=(c,S,tone,intent,level)=>{
const intro=introFor(tone,c),q1=questionFor(intent,c,S),bridge=bridgeFor(level,S),close=closeFor(intent,c);
return[
{name:'01 · CONVERSA NATURAL',why:'A mais humana para ler sem parecer roteiro',text:`${intro}\n\n${q1}\n\n${bridge}\n\n${close}`},
{name:'02 · CURIOSIDADE EXECUTIVA',why:'Abre uma lacuna mental sem exagerar promessa',text:`Boa tarde, tudo bem? Eu falo com quem responde pela operação da ${c}? Aqui é o Ryan Kirk, da Babel. Eu vou tomar só alguns segundos.\n\nEu queria te fazer uma pergunta: se amanhã a ${c} conseguisse continuar executando boa parte das rotinas sem alguém precisar lembrar o que vem depois, onde você sentiria o maior impacto?\n\nÉ esse tipo de operação que a Babel está construindo: menos tarefa manual, mais sistema acompanhando e agindo.\n\nPosso te mostrar um exemplo aplicado à ${c} em uma conversa curta?`},
{name:'03 · DIAGNÓSTICO REAL',why:'Parece conversa de negócio, não apresentação de software',text:`Boa tarde, tudo bem? Meu nome é Ryan Kirk, sou da Babel. Eu queria falar com quem conhece bem a operação da ${c}. É uma pergunta rápida.\n\n${S.question}\n\nEu pergunto porque a Babel entra exatamente nesses pontos: a gente transforma uma rotina que depende de alguém lembrar em uma operação que acompanha e executa sozinha.\n\nSe isso existir aí, eu consigo te mostrar em 15 minutos como eu pensaria essa automação para a ${c}. Faz sentido?`},
{name:'04 · VISÃO DE FUTURO',why:'Mais memorável, mas ainda falável por uma pessoa real',text:`Boa tarde, tudo bem? Aqui é o Ryan Kirk, da Babel. Eu queria falar com um dos responsáveis pela operação da ${c}.\n\nPosso te fazer uma pergunta diferente? Como seria a sua empresa se, em vez de pessoas operando o sistema o tempo todo, o sistema começasse a sustentar a operação e as pessoas ficassem mais focadas em decidir?\n\nÉ essa transição que a Babel está construindo. A gente começa pelas rotinas que hoje ainda são manuais ou semiautomáticas.\n\nSe eu te mostrar por onde isso poderia começar na ${c}, você me dá 15 minutos?`},
{name:'05 · DIRETO AO DECISOR',why:'Curto, limpo e forte para quem tem pouca paciência',text:`Boa tarde. Eu falo com quem responde pela operação da ${c}? Ryan Kirk, da Babel. Vou direto ao ponto.\n\n${q1}\n\nA Babel transforma esse tipo de rotina em uma operação automática, sem a equipe precisar comandar cada próxima ação.\n\nEu consigo te mostrar isso aplicado à ${c} em 15 minutos. Você topa conversar?`}
]};
const humanScore=text=>{const words=text.replace(/\n/g,' ').trim().split(/\s+/).filter(Boolean).length;const seconds=Math.max(20,Math.round(words/2.4));const natural=Math.max(88,Math.min(99,99-Math.max(0,words-105)*.12));return{words,seconds,natural:Math.round(natural)}};
const generate=()=>{const c=naturalCompany(q('#callCompany')?.value.trim());const sector=q('#callSector')?.value||'Negócios locais';const tone=q('#callTone')?.value||'Natural';const intent=q('#callIntent')?.value||'Gerar curiosidade';const level=Number(q('#callIntensity')?.value||2);const S=sectors[sector]||sectors['Negócios locais'];state.company=c;state.sector=sector;state.tone=tone;state.intent=intent;state.intensity=level;state.scripts=makeVariants(c,S,tone,intent,level);renderScripts();renderLive()};
const renderScripts=()=>{const root=q('#callScripts');root.innerHTML=state.scripts.map((s,i)=>{const m=humanScore(s.text);return`<article class="call-script-block"><div class="call-script-top"><div><div class="call-script-name">${esc(s.name)}</div><div class="call-script-meta">${esc(s.why)}</div></div><div class="call-script-actions"><button class="call-copy" data-copy="${i}">copiar inteiro</button><button class="call-use" data-use="${i}">usar ao vivo</button></div></div><div class="call-script-text">${esc(s.text)}</div><div class="call-human-score"><span class="call-score-chip"><b>${m.natural}/100</b> naturalidade</span><span class="call-score-chip"><b>~${m.seconds}s</b> leitura</span><span class="call-score-chip"><b>${m.words}</b> palavras</span></div><div class="call-hint">Leia como conversa: faça uma pausa depois da pergunta e deixe a outra pessoa responder antes de continuar.</div></article>`}).join('');qa('[data-copy]',root).forEach(b=>b.onclick=()=>copy(state.scripts[Number(b.dataset.copy)].text));qa('[data-use]',root).forEach(b=>b.onclick=()=>{state.active=Number(b.dataset.use);renderLive();q('#callLiveSection').scrollIntoView({behavior:'smooth',block:'start'});toast('Script carregado no modo ao vivo')})};

<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">03 · COMO SOAR HUMANO</div><h2>O texto é metade. A pausa é a outra metade.</h2></div><p class="call-section-desc">O Call OS foi escrito para voz. Use as frases como trilho, não como prisão. A pessoa do outro lado precisa sentir que existe alguém pensando, não recitando.</p></div><div class="call-grid"><div class="call-card call-span-6"><div class="call-card-label">REGRA 01</div><h3>Depois da pergunta, pare.</h3><p>Não responda a própria pergunta. Dê espaço para silêncio. A primeira informação valiosa aparece quando você para de falar.</p></div><div class="call-card call-span-6"><div class="call-card-label">REGRA 02</div><h3>Não acelere a apresentação.</h3><p>“Ryan Kirk, da Babel” precisa soar como apresentação normal. Não como um trecho decorado que você precisa terminar rápido.</p></div><div class="call-card call-span-6"><div class="call-card-label">REGRA 03</div><h3>Troque palavras que você nunca usa.</h3><p>Se você jamais diria “gostaria de validar uma hipótese” em uma conversa comum, não diga no telefone. Naturalidade vence sofisticação artificial.</p></div><div class="call-card call-span-6"><div class="call-card-label">REGRA 04</div><h3>A ligação não precisa fechar a venda.</h3><p>O objetivo é descobrir relevância e conquistar uma conversa de 15 minutos. Isso reduz pressão e melhora a qualidade do contato.</p></div></div></section>

q('#callSector').innerHTML=Object.keys(sectors).map(x=>`<option>${esc(x)}</option>`).join('');q('#callTone').innerHTML=toneNames.map(x=>`<option ${x==='Natural'?'selected':''}>${x}</option>`).join('');q('#callIntent').innerHTML=intentNames.map(x=>`<option>${x}</option>`).join('');const found=discover();q('#callCompanies').innerHTML=found.slice(0,18).map((x,i)=>`<button class="call-pill" data-company="${i}">${esc(x.name)}</button>`).join('');qa('[data-company]').forEach(b=>b.onclick=()=>{const x=found[Number(b.dataset.company)];q('#callCompany').value=x.name;q('#callSector').value=x.sector;generate()});q('#openCallOS').onclick=()=>{os.classList.add('open');document.documentElement.style.overflow='hidden'};q('#closeCallOS').onclick=()=>{os.classList.remove('open');document.documentElement.style.overflow=''};q('#callGenerate').onclick=generate;['callSector','callTone','callIntent','callIntensity'].forEach(id=>q('#'+id).addEventListener('change',generate));q('#callCompany').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;q('#callStart').onclick=()=>{if(state.timerId){clearInterval(state.timerId);state.timerId=null;q('#callStart').textContent='continuar'}else{state.timerId=setInterval(()=>{state.timer++;q('#callTimer').textContent=fmt(state.timer)},1000);q('#callStart').textContent='pausar'}};q('#callReset').onclick=()=>{clearInterval(state.timerId);state.timerId=null;state.timer=0;q('#callTimer').textContent='00:00';q('#callStart').textContent='iniciar'};qa('[data-outcome]').forEach(b=>b.onclick=()=>{let h=[];try{h=JSON.parse(localStorage.getItem('babel-call-human-history')||'[]')}catch{}h.unshift({company:state.company,sector:state.sector,tone:state.tone,intent:state.intent,script:(state.scripts[state.active]?.name||''),outcome:b.dataset.outcome,notes:q('#callNotes').value,date:new Date().toLocaleString('pt-BR')});localStorage.setItem('babel-call-human-history',JSO
