const renderScript=()=>{const purposes=['DECISOR','PERMISSÃO','PERGUNTA','POSICIONAMENTO','PRÓXIMA AÇÃO'];const box=q('#callLines');box.innerHTML=state.script.map((line,i)=>`<div class="call-line-item"><div class="call-line-n">${i+1}</div><div><div class="call-line-copy">${esc(line)}</div><div class="call-line-purpose">${purposes[i]}</div></div><button class="call-copy-btn" data-copy-line="${i}">copiar</button></div>`).join('');qa('[data-copy-line]',box).forEach(b=>b.onclick=()=>copy(state.script[Number(b.dataset.copyLine)]));const total=state.script.join(' ').split(/\s+/).length;const score=Math.max(80,Math.min(99,100-Math.max(0,total-72)/3));q('#callScriptScore').innerHTML=`<b>${Math.round(score)}</b>/100 · ${total} palavras`;const S=sectors[state.sector]||sectors['Negócios locais'];q('#callSectorQuestion').textContent=S.question;q('#callSectorProof').textContent=S.proof;const variants=[['ULTRACURTA',`${apply(tones.Minimalista.open,state.company)} ${apply(tones.Minimalista.intro,state.company)} ${apply(intents['Gerar curiosidade'],state.company)}`],['AUTORIDADE',`${apply(tones.Executivo.open,state.company)} ${apply(tones.Executivo.intro,state.company)} Hoje nosso foco é levar empresas do manual para uma operação autônoma.`],['QUEBRA DE PADRÃO',`${apply(tones.Provocador.open,state.company)} ${apply(tones.Provocador.intro,state.company)} ${apply(intents['Quebrar padrão'],state.company)}`]];q('#callVariants').innerHTML=variants.map(v=>`<div class="call-variant"><div class="call-variant-tag">${v[0]}</div><p>${esc(compress(v[1]))}</p></div>`).join('');};
const renderLive=()=>{state.liveIndex=Math.min(state.liveIndex,Math.max(0,state.script.length-1));q('#callTeleText').textContent=state.script[state.liveIndex]||'Gere um script.';q('#callProgress').style.width=`${((state.liveIndex+1)/(state.script.length||5))*100}%`;q('#callLiveCount').textContent=`${state.liveIndex+1}/${state.script.length||5}`;};
const objections=()=>{const replies={
'Agora não':`Perfeito. Me dá só um horário melhor e eu volto com uma única pergunta.`,
'Manda WhatsApp':`Mando. Só me diz uma coisa para eu não mandar material genérico: hoje o maior gargalo é atendimento, follow-up ou operação?`,
'Já temos sistema':`Ótimo. Ele apenas organiza informação ou também decide e executa a próxima ação sem depender da equipe?`,
'Não tenho interesse':`Sem problema. Só para eu não insistir errado: hoje a operação de vocês já trabalha sem depender de tarefas manuais repetitivas?`,
'R$2.000 é caro':`Concordo se não devolver mais do que R$2.000. A conta só faz sentido se a automação recuperar receita ou capacidade acima disso.`,
'Quem é você?':`Ryan Kirk, da Babel. Nós estamos estruturando automação operacional para empresas que ainda dependem de processos manuais ou semiautomáticos.`};q('#callReplies').innerHTML=Object.entries(replies).map(([a,b])=>`<div class="call-reply"><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('');};
const renderHistory=()=>{let h=[];try{h=JSON.parse(localStorage.getItem('babel-call-v2-history')||'[]')}catch{}const stats={calls:h.length,connected:h.filter(x=>x.outcome!=='Sem contato').length,meetings:h.filter(x=>x.outcome==='Reunião').length,follow:h.filter(x=>x.outcome==='Retornar').length};q('#statCalls').textContent=stats.calls;q('#statConnected').textContent=stats.connected;q('#statMeetings').textContent=stats.meetings;q('#statFollow').textContent=stats.follow;q('#callHistory').innerHTML=h.length?h.slice(0,12).map(x=>`<div class="call-history-row"><b>${esc(x.company)}</b><span>${esc(x.outcome)}</span><span>${esc(x.date)}</span></div>`).join(''):'<div style="font-size:9px;color:#5f7b69;padding:12px 0">Nenhuma ligação registrada.</div>'};
const mount=()=>{if(q('#babelCallOS'))return;const launch=document.createElement('section');launch.className='call-launch-wrap';launch.innerHTML=`<div class="call-launch"><div class="call-launch-kicker">Babel · Call Intelligence</div><h2>A inteligência acaba aqui.<br>A conversa começa agora.</h2><p>Entre em um sistema desenhado exclusivamente para prospecção por telefone: scripts curtos, intenção controlável, variações por empresa, objeções e execução ao vivo.</p><div class="call-launch-row"><button class="call-main-btn" id="openCallOS">LIGAR</button><span class="call-launch-proof"><b>5 linhas</b> · uma pergunta · uma próxima ação</span></div></div>`;document.body.appendChild(launch);
const os=document.createElement('div');os.id='babelCallOS';os.className='call-os';os.innerHTML=`<div class="call-topbar"><div class="call-brand"><b>BABEL</b> · CALL OS</div><div class="call-top-state"><span class="call-dot"></span> cold call intelligence active</div><button class="call-close" id="closeCallOS">voltar ao mapa</button></div><main class="call-page"><section class="call-hero"><div class="call-eyebrow">CALL OS · A NOVA CAMADA ENTRE DADO E RECEITA</div><h1 class="call-h1">Cinco linhas.<br>Uma pergunta.<br><em>Uma porta aberta.</em></h1><p class="call-lead">O objetivo não é falar muito. É dizer a frase certa para a pessoa certa, no tom certo, e conquistar a próxima conversa. Toda a página trabalha em torno dessa disciplina.</p><div class="call-rule"><span><b>01</b> encontre o decisor</span><span><b>02</b> ganhe permissão</span><span><b>03</b> provoque pensamento</span><span><b>04</b> posicione Babel</span><span><b>05</b> marque o próximo passo</span></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">01 · CALL DNA</div><h2>Controle a intenção antes da frase.</h2></div><p class="call-section-desc">Empresa, setor, tom e intenção mudam o roteiro. O script deve se adaptar à conversa — não obrigar a conversa a se adaptar ao script.</p></div><div class="call-sticky-dna"><div class="call-dna-grid"><input class="call-input" id="callCompany" placeholder="Empresa"><select class="call-select" id="callSector"></select><select class="call-select" id="callTone"></select><select class="call-select" id="callIntent"></select><select class="call-select" id="callIntensity"><option value="1">Intensidade 1</option><option value="2" selected>Intensidade 2</option><option value="3">Intensidade 3</option></select><button class="call-generate" id="callGenerate">GERAR</button></div><div class="call-source-pills" id="callCompanies"></div></div><div class="call-script-main"><div class="call-script-meta"><div><div class="call-eyebrow">SCRIPT PRINCIPAL · 5 LINHAS</div><span class="call-chip" id="callDNAChip">executivo · curiosidade</span></div><div class="call-score" id="callScriptScore"><b>—</b>/100</div></div><div class="call-lines" id="callLines"></div></div><div class="call-variants" id="callVariants"></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">02 · A ESTRUTURA VALIDADA</div><h2>Do seu script para uma arquitetura de conversa.</h2></div><p class="call-section-desc">Preservamos a essência: decisor → identidade → uma pergunta → visão de autonomia. A evolução é remover excesso, aumentar especificidade e terminar sempre com uma próxima ação.</p></div><div class="call-flow"><div class="call-flow-step"><b>DECISOR</b><span>“Quem responde pela operação?”</span></div><div class="call-flow-step"><b>PERMISSÃO</b><span>“Ryan Kirk, Babel. 20 segundos.”</span></div><div class="call-flow-step"><b>PERGUNTA</b><span>Faça a pessoa imaginar ou revelar o problema.</span></div><div class="call-flow-step"><b>BABEL</b><span>Explique em uma frase o movimento manual → autônomo.</span></div><div class="call-flow-step"><b>PRÓXIMO PASSO</b><span>Peça 15 minutos, não a venda inteira.</span></div></div><div class="call-grid" style="margin-top:12px"><div class="call-card call-span-6"><div class="call-card-label">PERGUNTA ESPECÍFICA DO SETOR</div><h3 id="callSectorQuestion">—</h3><p>Use quando quiser sair da visão abstrata e entrar no problema operacional real.</p></div><div class="call-card call-span-6"><div class="call-card-label">VALOR QUE DEVE APARECER</div><h3 id="callSectorProof">—</h3><p>Não venda “automação”. Venda o efeito econômico e operacional da automação.</p></div></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">03 · OBJECTION SNAPBACK</div><h2>Respostas de uma respiração.</h2></div><p class="call-section-desc">Objeção não pede discurso. Responda curto e devolva a conversa para uma pergunta.</p></div><div class="call-quick-replies" id="callReplies"></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">04 · ECONOMIA DA VENDA</div><h2>R$ 2.000 precisa parecer uma conta, não um preço.</h2></div><p class="call-section-desc">O contrato ganha sentido quando o decisor entende quantos pacientes, reservas, serviços ou vendas precisam ser recuperados para pagar o sistema.</p></div><div class="call-break-even"><div class="call-card"><label class="call-label">Valor médio de uma venda/cliente</label><input class="call-input" id="callAvgTicket" type="number" value="500" min="1"><div class="call-money" id="callBreakEven">4 vendas</div><p>Quantidade aproximada necessária para cobrir R$ 2.000/mês.</p></div><div class="call-card"><div class="call-card-label">FRASE DE VALOR</div><h3 id="callEconomicLine">Se o sistema recuperar 4 vendas que hoje se perdem, ele se paga.</h3><p>Use só depois de descobrir contexto. Nunca abra uma cold call falando de preço.</p></div></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">05 · LIVE CALL</div><h2>Uma linha por vez.</h2></div><p class="call-section-desc">Sem painel complexo. Leia a ideia, fale com naturalidade e avance. O sistema mostra somente a próxima frase.</p></div><div class="call-tele"><div class="call-tele-text" id="callTeleText">Gere seu script para começar.</div></div><div class="call-livebar"><div><span class="call-timer" id="callTimer">00:00</span> <span id="callLiveCount" style="font-size:8px;color:#64806d">1/5</span></div><div class="call-controls"><button class="call-control" id="callPrev">← anterior</button><button class="call-control primary" id="callStart">iniciar</button><button class="call-control" id="callNext">próxima →</button><button class="call-control" id="callReset">reset</button></div></div><div class="call-progress"><span id="callProgress"></span></div></section>
<section class="call-section"><div class="call-section-head"><div><div class="call-section-num">06 · CALL MEMORY</div><h2>O melhor script nasce das suas próprias ligações.</h2></div><p class="call-section-desc">Registre o resultado localmente. Com o tempo, o Call OS deixa de ser uma biblioteca de scripts e vira memória comercial.</p></div><div class="call-stats"><div class="call-stat"><div class="call-stat-value" id="statCalls">0</div><div class="call-stat-label">ligações</div></div><div class="call-stat"><div class="call-stat-value" id="statConnected">0</div><div class="call-stat-label">conexões</div></div><div class="call-stat"><div class="call-stat-value" id="statMeetings">0</div><div class="call-stat-label">reuniões</div></div><div class="call-stat"><div class="call-stat-value" id="statFollow">0</div><div class="call-stat-label">retornos</div></div></div><textarea class="call-textarea" id="callNotes" rows="3" placeholder="Uma frase sobre o que aconteceu na ligação..." style="margin-top:10px"></textarea><div class="call-outcomes"><button class="call-outcome" data-outcome="Reunião">✓ reunião</button><button class="call-outcome" data-outcome="Retornar">↻ retornar</button><button class="call-outcome" data-outcome="Sem interesse">× sem interesse</button><button class="call-outcome" data-outcome="Sem contato">○ sem contato</button></div><div class="call-history" id="callHistory"></div></section>
<section class="call-section" style="border-bottom:0"><div class="call-eyebrow">TESE DO CALL OS</div><div class="call-philosophy">O mercado treinou vendedores para <b>falar melhor.</b><br>A Babel pode treiná-los para <b>pensar melhor antes de falar.</b></div><p class="call-lead" style="margin-top:20px">O produto extraordinário não será uma coleção infinita de scripts. Será um sistema que aprende qual combinação de empresa, setor, tom, intenção, pergunta e objeção produz a próxima reunião.</p></section></main></div><div class="call-toast" id="callToast"></div>`;document.body.appendChild(os);
const sectorSel=q('#callSector'),toneSel=q('#callTone'),intentSel=q('#callIntent');sectorSel.innerHTML=Object.keys(sectors).map(x=>`<option>${esc(x)}</option>`).join('');toneSel.innerHTML=Object.keys(tones).map(x=>`<option>${esc(x)}</option>`).join('');intentSel.innerHTML=Object.keys(intents).map(x=>`<option>${esc(x)}</option>`).join('');const found=discover();q('#callCompanies').innerHTML=found.slice(0,18).map((x,i)=>`<button class="call-company-pill" data-company="${i}">${esc(x.name)}</button>`).join('');qa('[data-company]').forEach(b=>b.onclick=()=>{const x=found[Number(b.dataset.company)];q('#callCompany').value=x.name;q('#callSector').value=x.sector;makeScript()});
q('#openCallOS').onclick=()=>{os.classList.add('open');document.documentElement.style.overflow='hidden'};q('#closeCallOS').onclick=()=>{os.classList.remove('open');document.documentElement.style.overflow=''};q('#callGenerate').onclick=makeScript;['callTone','callIntent','callSector','callIntensity'].forEach(id=>q('#'+id).addEventListener('change',()=>{q('#callDNAChip').textContent=`${q('#callTone').value.toLowerCase()} · ${q('#callIntent').value.toLowerCase()}`;makeScript()}));q('#callCompany').addEventListener('keydown',e=>{if(e.key==='Enter')makeScript()});q('#callAvgTicket').oninput=()=>{const v=Math.max(1,Number(q('#callAvgTicket').value||1));const n=Math.ceil(2000/v);q('#callBreakEven').textContent=`${n} ${n===1?'venda':'vendas'}`;q('#callEconomicLine').textContent=`Se o sistema recuperar ${n} ${n===1?'venda':'vendas'} que hoje se perdem, ele cobre R$ 2.000/mês.`};
q('#callPrev').onclick=()=>{state.liveIndex=Math.max(0,state.liveIndex-1);renderLive()};q('#callNext').onclick=()=>{state.liveIndex=Math.min((state.script.length||1)-1,state.liveIndex+1);renderLive()};const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;q('#callStart').onclick=()=>{if(state.timerId){clearInterval(state.timerId);state.timerId=null;q('#callStart').textContent='continuar'}else{state.timerId=setInterval(()=>{state.timer++;q('#callTimer').textContent=fmt(state.timer)},1000);q('#callStart').textContent='pausar'}};q('#callReset').onclick=()=>{clearInterval(state.timerId);state.timerId=null;state.timer=0;state.liveIndex=0;q('#callTimer').textContent='00:00';q('#callStart').textContent='iniciar';renderLive()};qa('[data-outcome]').forEach(b=>b.onclick=()=>{let h=[];try{h=JSON.parse(localStorage.getItem('babel-call-v2-history')||'[]')}catch{}h.unshift({company:state.company,sector:state.sector,tone:state.tone,intent:state.intent,outcome:b.dataset.outcome,notes:q('#callNotes').value,date:new Date().toLocaleString('pt-BR')});localStorage.setItem('babel-call-v2-history',JSON.stringify(h.slice(0,100)));q('#callNotes').value='';renderHistory();toast('Ligação registrada')});objections();makeScript();renderHistory();q('#callAvgTicket').dispatchEvent(new Event('input'));
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
