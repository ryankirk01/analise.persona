name: apply-call-os

on:
  push:
    paths:
      - 'digital.html'
      - 'scripts/patch-night-sales.mjs'
      - 'scripts/call-os-v2.fragment.html'
      - 'scripts/call-os-revolution.fragment.html'
      - 'scripts/call-soul-theater.fragment.html'
      - 'scripts/call-thesis-os.fragment.html'
      - 'scripts/call-focus-os.fragment.html'
      - 'scripts/call-ego-revolution.fragment.html'
      - 'scripts/call-radar-deep.fragment.html'
      - 'scripts/call-copy-v4.snippet.txt'
      - 'scripts/upgrade-call-copy-v4.mjs'
      - 'scripts/fix-call-late-mount.mjs'
      - 'scripts/smoke-call-os.sh'
      - 'scripts/smoke-digital-market.sh'
      - 'scripts/validate-call-js.mjs'
      - '.github/workflows/apply-night-sales-option.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical Call Copy V4
        run: node scripts/upgrade-call-copy-v4.mjs
      - name: Make Call Intelligence mount whenever LIGAR opens
        run: node scripts/fix-call-late-mount.mjs
      - name: Validate all Call OS JavaScript syntax
        run: node scripts/validate-call-js.mjs
      - name: Rebuild compressed page with Digital Market portal
        run: node scripts/patch-night-sales.mjs
      - name: Browser smoke test — Call OS
        run: bash scripts/smoke-call-os.sh
      - name: Browser smoke test — Mercado Digital 40 companies
        run: bash scripts/smoke-digital-market.sh
      - name: Commit canonical source and generated page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/call-os-v2.fragment.html scripts/call-os-revolution.fragment.html scripts/call-soul-theater.fragment.html scripts/call-thesis-os.fragment.html scripts/call-focus-os.fragment.html scripts/call-ego-revolution.fragment.html scripts/call-radar-deep.fragment.html index.html v82-01.txt v82-02.txt v82-03.txt v82-04.txt v82-05.txt v82-06.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: publish Mercado Digital portal and market intelligence'
          git push origin HEAD:main
