name: apply-call-os

on:
  push:
    paths:
      - 'scripts/patch-night-sales.mjs'
      - '.github/workflows/apply-night-sales-option.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract browser module as raw fragment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-night-sales.mjs')
          s=p.read_text()
          marker='const js=String.raw`'
          start=s.index(marker)
          end=s.index("\n\nhtml=html.replace('</head>'", start)
          raw=s[start+len(marker):end].rstrip()
          if not raw.endswith('`;'):
              raise SystemExit('Call OS fragment terminator not found')
          raw=raw[:-2]
          Path('scripts/call-os.fragment.html').write_text(raw)
          s=s[:start]+"const js=fs.readFileSync('scripts/call-os.fragment.html','utf8');"+s[end:]
          p.write_text(s)
          PY
      - name: Rebuild compressed page with Call OS
        run: node scripts/patch-night-sales.mjs
      - name: Commit generated page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v82-01.txt v82-02.txt v82-03.txt v82-04.txt v82-05.txt v82-06.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: publish Babel Call OS module'
          git push origin HEAD:main
